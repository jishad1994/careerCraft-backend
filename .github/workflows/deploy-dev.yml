name: Deploy Backend Dev

on:
  push:
    branches:
      - dev

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/careercraft-backend:dev
            ${{ secrets.DOCKERHUB_USERNAME }}/careercraft-backend:${{ github.sha }}

      - name: Deploy on EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/careerCraft-backend

            docker compose down

            docker image rm ${{ secrets.DOCKERHUB_USERNAME }}/careercraft-backend:dev || true

            docker system prune -a -f
            docker builder prune -f

            docker compose pull backend
            docker compose up -d

            docker image prune -f

            docker ps
            df -h